name: Release

on:
  push:
    tags: ["*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const { readFileSync, writeFileSync } = require("node:fs");
          const version = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`Invalid version tag: ${version}`);

          const read = (file) => JSON.parse(readFileSync(file, "utf8"));
          const write = (file, value) => writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          const manifest = read("manifest.json");

          for (const file of ["package.json", "manifest.json"]) {
            const value = read(file);
            value.version = version;
            write(file, value);
          }

          const versions = read("versions.json");
          versions[version] = manifest.minAppVersion;
          write("versions.json", versions);
          EOF

          if git diff --quiet -- package.json manifest.json versions.json; then
            exit
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json versions.json
          git commit -m "chore: sync version to $RELEASE_VERSION"
          git push origin HEAD:main
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --draft
          --generate-notes
          main.js manifest.json styles.css
